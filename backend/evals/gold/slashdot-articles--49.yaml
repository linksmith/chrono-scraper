  ] Re:Who cares about developers ? by Permission Denied (Score:3) Monday March 17, @10:55AM Re:Who cares
  about developers ? by luwain (Score:2) Monday March 17, @10:59AM Re:Who cares about developers ? (Score:4,
  Insightful) by corvi42 (235814) on Monday March 17, @11:12AM ( #5528905 ) ( http://www.silencegreys.com/memetic_labs/
  | Last Journal: Sunday November 17, @12:39PM ) Supply and Demand, it''s as simple as that. Developers
  are the suppliers of product, desktop users are the consumers of same. The suppliers have to be anticipating
  upcoming trends in consumer tastes and responding to that. If they guess wrong then they can suffer
  inordinately, even go out of business. So it''s a reliable indicator of what trends the market will
  be feeling down the road if the producers ( as a body, not as individuals ) are gearing up for a particular
  shift in their production. If there is a definite noticeable shift on the part of developers to a different
  target platform, then that indicates one of a few things, as I see it: 1) There will be an upcoming
  shift in tastes on the part of consumers to that different platform. Developers see this upcoming shift
  and jump ( en masse ) to anticipate it. Or that because the developers shift, the consumers follow to
  gain the advantages of new products. Most likely a combination of the above. 2) Developers can continue
  to produce for the current tastes of consumers while lowering their own costs of production. It could
  be that there is no impending shift of demand to the linux platform, but the ability to build cross-platform
  apps using linux technology gives developers an edge while lowering their own costs. 3) The entire body
  of developers, as a class of informed professionals, are all self-delusional. They have bought into
  the Linux hype and are making the worst decision of their careers, and hence are heading over a cliff
  like so many lemmings. It seems to me that this argument will be very hard to defend. The dynamic of
  supply and demand simply won''t allow large scale trends NOT to be based upon advantages and improvements
  in the market. That''s why we should care about these statistics about developers. [ Parent ] Re:Who
