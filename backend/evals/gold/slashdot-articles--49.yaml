  ) Well, he may have written what you would call "another gnome sucks" article, but for a lot of people
  that article made a lot of sense. He actually penned the feelings a lot of users have about Gnome. Please,
  this is not a flame war about Gnome/KDE, but about how Linux spreads and how difficult it is to get
  exact figure on how many people actually use Linux. And here I agree with him. The nature of Linux makes
  it hard to count. The nature og how MS spreads also makes it hard to get a realistic count. I would
  say it was a good article with a lot fo valid points. MS is loosing market and fast too. [ Parent ]
