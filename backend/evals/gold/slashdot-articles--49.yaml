  by eno2001 (527078) on Monday March 17, @03:20PM ( #5530809 ) (Last Journal: Thursday August 04, @11:15PM
  ) Actually, I have a laptop that I instlled Windows XP on about a half a year ago to give it a try (I
  am a 100% Linux user at home, only use Windows at work). The laptop has been up for as long as 90 days
  at a time and has only had to go down because I wanted to shut it down. It could probably run longer
  than the 90 days I''ve seen so far. I have had several applications crash, but no OS crash to date.
  However, I will also say that Linux has been just as stable for me. My record uptime so far is 299 days.
  I lost the uptime because of a power failure and didn''t have a UPS on the system. Current uptime on
  that system is 51 days. It runs as my PDC, WINS server, internal and external DNS servers (running to
  instances of named), SAMBA File and Print server and mail server all on a Celeron 400 with 64 Megs of
  RAM. Same thing with this box as the XP Pro box, no OS crashes, only application crashes every so often.
  At this point, I''d say that a custom installed XP and a custom installed Linux done by someone who
  KNOWS what they are doing are equally stable. The major benefits with the Linux box are price and licensing.
  Since I build my own Linux from scratch I don''t have to pay for the OS distribution or licensing. I
  didn''t have to pay for XP Pro for my laptop either since it''s not my laptop, but my employers. So,
  if you''ve had crappy experiences with either OS, chances are you haven''t researched the problem enough
  to resolve it. There is no substantial benefit of going with Windows for me, so I stick with Linux.
  It does everything I need it to. Inlucding video capture, video editing, and games. With RedHat 8.0
  the stakes just got higher too. [ Parent ] Re:Wrong, very wrong by TeraCo (Score:1) Monday March 17,
