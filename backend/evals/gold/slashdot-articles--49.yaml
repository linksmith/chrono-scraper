  Monday March 17, @10:05AM ( #5528559 ) I doubt that companies will want to develop a product for each
  OS, it''s too costly. If done properly multiplatform shouldn''t cost that much extra, compared to the
  increased number of possible customers. So for the time beeing I think we could expect quite a few multiplatform
  developments. Then the time will come when enough people realize that they can get all their favorite
  apps on both windows and linux. Then the two OS-es will finally compete on an equal footing and the
  customer will choose based on price and quality instead of whether ProgramX will run. I expect MS will
  have to change it''s pricing drastically in order to stay a major player This is ofcource assuming MS
  doesn''t manage to get linux outlawed as "terrorist tools" or use some other kind of legal extortion
  too keep it''s lead. on a more humorous note: My girlfriend cares about at least one. developer... That''s
  nice, good luck to the both of you. Could you please give me a few pointers on how to achieve this.
  My wife care''s for me, except for the developer part, she appear to believe it interferes with our
