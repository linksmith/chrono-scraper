  ( #5528318 ) ( http://shlrm.org/ | Last Journal: Monday June 09, @12:00PM ) But if most developers are
  writing for linux, then more software will start appearing for linux. Companies hiring these linux developers
  will have software written for linux, and the end user will have to use it. It''s kinda like using microsoft''s
  tactics against them, the end users won''t have another choice. I doubt that companies will want to
  develop a product for each OS, it''s too costly. So, they''ll pick a platform and stick with it. If
  most of the developers that apply for the job are specialized in linux, the company may decide that
  it''s a good way to go, since lots of people are writing for it. on a more humorous note: My girlfriend
  cares about at least one developer... [ Parent ] Re:Who cares about developers ? (Score:5, Insightful)
  by Anonymous Coward on Monday March 17, @09:31AM ( #5528377 ) But if most developers are writing for
  linux, then more software will start appearing for linux. Companies hiring these linux developers will
  have software written for linux, and the end user will have to use it. The problem is, by numbers, most
  software written is either for small commercial installations, or is written by developers for developers
  for fun. I wouldn''t be surprised if 99% of software is only used by 1% of users. Even if 80% of software
  written was for Linux, it doesn''t mean squat, because almost all users just want IE, Word, MSN Messenger,
  and a few games, and nothing whatsoever beyond that. [ Parent ] Re:Who cares about developers ? by Anonymous
  Coward (Score:1) Monday March 17, @10:30AM Re:Who cares about developers ? (Score:5, Insightful) by
  IWannaBeAnAC (653701) on Monday March 17, @12:01PM ( #5529210 ) Fallacy. A linux user using ''doze for
  the first time experiences exactly the same thing, if anything even worse, if you compare the amount
  of cruft and general weirdness of linux vs ''doze. True, learning a new system is a big barrier, but
  I don''t think there is anything intrinsically harder about learning linux. Its like saying "DVD players
  arn''t for the masses" just because the controls are different from a VCR. If its useful enough, then
  people will just learn to use it. [ Parent ] Re:Who cares about developers ? (Score:4, Insightful) by
  blahlemon (638963) on Monday March 17, @12:52PM ( #5529614 ) A linux user using ''doze for the first
  time experiences exactly the same thing, if anything even worse, if you compare the amount of cruft
  and general weirdness of linux vs ''doze. I actually disagree with you, I think a Linux user going to
  a Windows environment has a much easier time. In part because many things in Windows are specifically
  dumbed down to make them single click applications. A perfect example is MacroMedia Shockwave. In Windows
  when I wanted it I just clicked on MacroMedia''s site and it installed itself. For Linux, however, I
  had to jump thru hops, navigate hidden directories and manually do it. I do think you are correct in
  one aspect however, if a Linux user was on a Windows box and wanted to twik it or perform administrative
  tasks they would have a steeper learning curve, especially with XP. Over all though, for user stupidness/friendlyness
  I would say Windows has the upper hand. For now. And it''s not Linux''s fault either, BTW. It''s the
  third party companies that don''t build in that "I just want to click once and have it work" functionality.
  [ Parent ] Re:Who cares about developers ? (Score:5, Informative) by darkonc (47285) < stephen_samuel@bcgree
  n . c om > on Monday March 17, @04:28PM ( #5531402 ) ( http://bcgreen.com/~samuel | Last Journal: Friday
  April 30, @03:42PM ) I actually disagree with you, I think a Linux user going to a Windows environment
  has a much easier time. In part because many things in Windows are specifically dumbed down to make
  them single click applications. Dumbed down is fine for the first week or two. After that the dumbing
  down may get in the way (that''s my experience, but I''m a geek so I discount that anecdotal evidence).
  On the other hand, I''ve recently experienced some non-geek rommates, so their experience is more relevant
  to this discussion. When, my old roommate got to go from WIndows to Linux. His first week was like:
  "Hey, what''s this sucky OS? Why doesn''t anything work like Windows? why can''t I do this?". After
  the first couple of weeks he seemed to be getting used to Linux, and after a month or two he was more
  of a linux missionary than even I was. I was actually surprised by his enthusiastic embrace of Linux.
  I got him using Linux because it was easier on me (he was using my box). With Linux he had his own account
  with it''s own settings and I even had xdm set up so that ctrl-alt-F7 was him while ctrl-alt-f8 was
  me. No need to even logout. that was RH5.2 ~ 6.1. My new roommate has a friend who''s WIndows box self
  destructed. After recovering the data on his old disk, I installed RedHat 8.0, downloaded the MP3 extensions
  for XMMS, set up mplayer and let him take it home. I only got 1 or 2 support calls in the first couple
  of days -- After that, silence. It was so quiet, I was actually wondering if he''d given up and gone
  back to WIndows so I called him. He was quietly happy. Linux was doing everything he needed. It just
  wasn''t doing anything wrong . Now my roommate, who originally pretty much swore that he''d never move
  from Windows ("Everything I know how to do is on WIndows. Why would I learn another OS?"). Is starting
  to use the 7.3 installation that I dropped onto his system (a disk from an old computer of mine that
  died). I didn''t even know that he was making any real use of it until he mentioned that now was a good
  time to install the upgrades that I''d wanted. You know you''ve got a kickin'' OS when the support people
  are worried by the silence. [ Parent ] Re:Who cares about developers ? by darkonc (Score:2) Monday March
