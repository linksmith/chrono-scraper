  keeping my computer in a locked room lest it''ll be the victim of a jealousey murder :) [ Parent ] Take
  Marketing 101 (Score:4, Insightful) by Anonymous Coward on Monday March 17, @10:13AM ( #5528613 ) Any
  company which wants to stay in business knows that it''s the Customers who drive the business. Why do
  you think Motorola is such a crappy company? It''s run by engineers! All they do is create, create,
  create, but never bother to ask "does anyone want this crap?" I have Linux at home, but that doesn''t
  mean I''m blind ... customers drive the market, not developers. Convence John Q. that Linux is superior,
  and then everyone will use it. [ Parent ] Re:Who cares about developers ? (Score:5, Interesting) by
  ahfoo (223186) on Monday March 17, @10:16AM ( #5528629 ) (Last Journal: Friday April 04, @01:49AM )
  Also it depends what you''re defining as "developer." If you include people using multimedia presentation
  stuff like Director or an e-learning system like Authorware, there''s really very little difference
  between targeting Linux -vs- Microsoft because the media these products produce runs fine under Wine
  when built with a windows runtime. These closed source tools don''t have much nerd crediblity as they
  were built to hide the "programming" so they are often ignored by the open source community, but they''re
  interesting because of their deep integration in education. We''re talking huge taxpayer bucks have
  been spent on this stuff. I think it''s really important that we get people to vote on the upcoming
  legislation directing government money towards open souce and education is a huge part of that. One
  of the arguments that you''re going to hear is that the schools will have to toss all their old software
  because it only runs on Windows. Well, that''s total bullshit. I''ve never seen one of these Macromedia
  education apps that won''t run under Wine. If we introduce open source in the K-12 schools, it''s just
  a matter of time till Windows becomes little more than a history lesson. [ Parent ] Re:Wrong, very wrong
