title: Debunking Linux-Windows Market Share Myths
body: 'About Nicholas Petreley (Score:5, Informative) by lord sibn (649162) on Monday March 17, @09:06AM
  ( #5528252 ) You may recall that lately he wrote yet-another-gnome-sucks editorial (completely disregarding
  the notion of "user preference," which generally disregards technical aspects of a situation in the
  first place). I hope he''s right about this, but I look at it with cautios optimism. One can never really
  know for sure whether what you are getting is a factual account ot the way things are, or the way he
  thinks they oughtta be. About Linuxworld.com by Anonymous Coward (Score:3) Monday March 17, @09:29AM
