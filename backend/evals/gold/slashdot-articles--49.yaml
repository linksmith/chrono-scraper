  Monday March 17, @09:26AM Re:Who cares about developers ? (Score:5, Insightful) by Daniel Dvorkin (106857)
  on Monday March 17, @09:29AM ( #5528363 ) ( http://www.sff.net/people/Daniel.Dvorkin ) Indeed -- an
  impression that Microsoft tries to foster, of course. And built into this Windows Computer(tm) are all
  of these wonderful Microsoft Innovations(tm) like Word(tm) and The Internet(tm). But I''ve found that
  in talking to even very computer-illiterate people, it''s not that hard to get them over this conceptual
  block. Explain in simple terms what hardware is, what an OS is, what application software is, and that
  you have choices in all areas, and they''re pretty happy. People like having choices -- and they may
  be confused into thinking that Dell vs. Gateway vs. HPaq is a "choice," but once they understand the
  situation a little better, they''ll often have the brains to make a more informed decision. Also, there
  is a growing number of people in the middle ground of computer literacy -- the world isn''t just 1337
  and 1uz3rz any more. These people aren''t programmers, but they have some idea what''s going on inside
  the computer, they''re comfortable with fairly complex tasks in a wide variety of applications, and
  although they may not know a whole lot about the alternatives to Windows/Office/IE, they know that those
  alternatives are out there and they want to learn more. [ Parent ] Re:Who cares about developers ? (Score:5,
  Interesting) by SunPin (596554) < slashspam@cyCOFF ... m minus caffeine > on Monday March 17, @10:00AM
  ( #5528529 ) ( http://www.treyonics.com/ ) On the money, man. I believe, however, that zealots lose
  focus on how to get the "middle ground" educated about alternatives. These people don''t read LinuxWorld
  or even Slashdot yet that is where the battle against Windows--or more specifically, the battle against
  Microsoft''s control of consumer knowledge--will be decided. More easy-to-read articles need to go into
  publications that don''t typically discuss computer related items. Editors are always looking for interesting
  articles and, if the more verbally adept among us can target mainstream publications, the better chance
  that the Linux alternative has. Assuming a conspiracy against Linux gives Microsoft WAY MORE credit
  than they deserve. Making sarcastic comments about Linux as an OS for hackers and pirates accomplishes
  nothing. Start the battle on the premise that there are alternatives. Once people know about the alternatives,
  then the "Linux rulz" crowd is useful in spreading their cause. Right now, they have it backwards and
  Microsoft is firmly in control because of it. [ Parent ] 1 reply beneath your current threshold. Re:Who
  cares about developers ? (Score:5, Interesting) by dnoyeb (547705) on Monday March 17, @09:36AM ( #5528398
  ) ( http://www.rigidsoftware.com/ | Last Journal: Tuesday April 15, @04:44PM ) True. I was explaining
  to my father just this weekend that Linux was a Free OS. He couldnt grasp what it did on that computer.
  I don''t think his mind was able to seperate Windows from "the computer." Not to mention "its free,
  but you can buy it in CompUSA." Say what!? Nothing is free, and that just confused him, so I left him
  thinking he could buy it at CompUSA, but I got the hook up just in case :D Also, windows has the correctness
  connundrum. People think any mistakes are their own and not the fault of windows, automatically... I
  think they would be more likely to blame Linux for any shortcomings. This means more phone calls to
  "yours truly." [ Parent ] Re:Who cares about developers ? (Score:5, Insightful) by TKinias (455818)
  on Monday March 17, @09:54AM ( #5528496 ) scripsit dnoyeb: Also, windows has the correctness connundrum.
  People think any mistakes are their own and not the fault of windows, automatically... I think they
  would be more likely to blame Linux for any shortcomings. Hmm. This isn''t, I think, restricted to Windows.
  I had an interesting OS X experience over the weekend. An acquaintance was having trouble with a USB
  external hard drive. OS X was locking up hard (at least keyboard and mouse, there was no network so
  I don''t know if I could have ssh''d in) when the device was disconnected the ``Mac way'''' (i.e., drag
  to trash or select File | Eject). The user assumed he was doing something wrong. To me it was obvious
  that this is some kind of bug in OS X''s USB support, but a user not confident in his skills assumed
  the error to be his own. The same goes, by the way, for other devices. I don''t really have any insecurities
  about my telephone-using skills, so if I encounter a mobile phone which isn''t easily usable I blame
  a bad UI. Other people seem to think it''s their own fault if they can''t immediately grok a bad UI.
