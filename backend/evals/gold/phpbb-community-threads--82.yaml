  There appears to be a problem with the path to your phpBB2 files. Normally when phpBB2 is installed,
  you put the directory "phpBB2" into your "public_html" directory, but it looks like on your website
  you placed the contents of your "phpBB2" directory into your "public_html" directory. I forget if installing
  the BibleGateway MOD involves setting any paths, so could you remind me if there are? One place to set
  a path (in phpBB2 in general) is: Go to the Administration Panel, then under General Admin click on
  Configuration, and enter the correct info for the "Script path." See the entry for Script path in the
  phpBB2 userguide for advice on exactly what to enter. Back to top JakeNess Registered User Joined: 07
