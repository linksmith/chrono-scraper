  ''/\b(2 Samuel) (\d{1,3}-?\d{0,3})(:?\d{0,2}-?\d{0,2})/i'', ''/\b(1 Sam) (\d{1,3}-?\d{0,3})(:?\d{0,2}-?\d{0,2})/i'',
