  15 Posted: Fri Mar 10, 2006 1:22 am Post subject: I was just thinking about this mod recently. Surely
  someone out there would be willing to host a MySQL database containing Bibles. This would make it possible
  to do a direct lookup. IE: When the user submits his/her post, the server does a query for version,
  book, chapter, verse, and replaces the BB code (IE: [bible]Acts 1:1[/bible] ) with a quote-like cite
  containing the verse. Perhaps a link could be attached so that they could translate it into a different
  version that they prefer. This would allow the text to remain static. This is good because it is easier
  on the servers, and also because certain arguments work best on certain versions of the Bible. Back
