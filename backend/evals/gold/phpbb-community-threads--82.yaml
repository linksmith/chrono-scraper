  Connersville, IN Posted: Thu Jul 20, 2006 3:46 am Post subject: Without using the massive regex recently
  posted to account for far more abbreviations and stuff (I didn''t understand it, so I didn''t touch
  it. ), I updated the original MOD with a few fixes as listed in this thread, and I changed the handling
  of the Bible versions from storing the abbreviation in the database to storing BibleGateway''s ID #s
  (note that this breaks backwards compatibility and the SQL will need to be ran again). In the following
  I have the NASB as default and did not include dynamic or paraphrase versions--a personal preference
  of mine that they aren''t worth ever using. Code: ##############################################################
  ## MOD Title: BibleGateway MOD ## MOD Author: romans1423 < rick.beckman@gmail.com > (Rick Beckman) http://fellowship-hall.com/index.php
  ## MOD Author: Trev < scs2tjd@leeds.ac.uk > (Trevor Dodds) http://www.luucu.com ## MOD Description:
  Automatically converts Bible passages into links ## MOD Version: 2.0.0 ## ## Installation Level: Intermediate
  ## Installation Time: 10 Minutes ## Files To Edit: includes/bbcode.php ## includes/usercp_register.php
  ## admin/admin_users.php ## templates/subSilver/profile_add_body.tpl ## templates/subSilver/admin/user_edit_body.tpl
  ## language/lang_english/lang_main.php ## includes/functions_selects.php ## Included Files: n/a ## License:
  http://opensource.org/licenses/gpl-license.php GNU General Public License v2 ##############################################################
  ## For security purposes, please check: http://www.phpbb.com/mods/ ## for the latest version of this
  MOD. Although MODs are checked ## before being allowed in the MODs Database there is no guarantee ##
  that there are no security problems within the MOD. No support ## will be given for MODs not found within
  the MODs Database which ## can be found at http://www.phpbb.com/mods/ ##############################################################
  ## Author Notes: This MOD should be useful for forums with religious content, Christian ## communities
  etc. It will convert any message text that references a Bible passage in standard ## notation to a link
  to that part of the Bible. The link will open in a new window, and display ## the Bible text using Bible
  Gateway (http://www.biblegateway.com). The user may also specify ## the translation they wish to read
  these links in, using an extra option in their profile. ## ## Standard abbreviations can also be used,
  e.g. Matt 3:5-7 will be converted into a link to ## Mathew 3:5-7 in the user''s preferred version of
  the Bible. You should also note that it is ## case insensitive. ## ##############################################################
  ## MOD History: ## ## 2003-12-27 - Version 1.0.0 ## - Initial release ## 2004-04-09 - Version 1.0.1
  ## - Added htmlspecialchars() around $HTTP_POST_VARS ## 2004-08-31 - Version 1.0.2 ## - In includes/bbcode.php,
  changed $bibletype[0] to $bibletype[''user_bibletype''] ## - Also in includes/bbcode.php, changed the
  & characters to &amp; ## 2006-07-19 - Version 2.0.0 ## - Changed Bible versions to an integer using
  BibleGateway IDs. ## - Fixed a couple of bugs in the regex in BBCode.php ## - Moved available Bible
  versions to language file ## - Version changed to 2.0.0 to reflect lack of backward compatibility ##
  ############################################################## ## Before Adding This MOD To Your Forum,
  You Should Back Up All Files Related To This MOD ##############################################################
