title: Come Along Do! (1898)
body: 'User Comments: Pleasant Light Comedy , 24 February 2005 Author: Snow Leopard from Ohio This pleasant
  light comedy is fairly amusing, and it is also rather engaging at times. It''s simple in concept and
  in execution, and it''s not uproarious or anything of the sort, but instead is an early, simple example
  of the kind of dry humor that is based on human nature itself, rather than on action or on humorous
  predicaments. The whole scenario features a rather elderly couple sitting outside an art exhibit, having
  a snack before going in. The wife seems to get just a little impatient with her husband, suggesting
  the title phrase. Nothing fancy or complicated arises, but a couple of little touches work pretty well
  in creating some light humor. As with most of the earliest narrative features, the main task of the
  film-makers was to create a setting and a camera field that could accommodate as much as possible. In
  this case, they set things up so as to create a view not only of the main couple, but also of enough
  of their surroundings (in particular, the signs in the background) so as to provide a complete picture
  of the situation. It also accommodates a couple of other characters who appear briefly. It''s all put
  together well enough to make pretty good use out of the main idea. Check for other user comments. I
  have seen this movie and would like to comment on it Message Boards Discuss this movie with other users
  on IMDb message board for Come Along Do! (1898) Recommendations If you like this title, we also recommend...
