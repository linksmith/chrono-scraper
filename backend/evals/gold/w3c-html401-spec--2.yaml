    'HTML 4.01 Specification W3C Recommendation 24 December 1999 This version: http://www.w3.org/TR/1999/REC-html401-19991224
    ( plain text [794Kb] , gzip''ed tar archive of HTML files [371Kb] , a .zip archive of HTML files [405Kb]
    , gzip''ed Postscript file [746Kb, 389 pages] , gzip''ed PDF file [963Kb] ) Latest version of HTML 4.01:
    http://www.w3.org/TR/html401 Latest version of HTML 4: http://www.w3.org/TR/html4 Latest version of
    HTML: http://www.w3.org/TR/html Previous version of HTML 4.01: http://www.w3.org/TR/1999/PR-html40-19990824
    Previous HTML 4 Recommendation: http://www.w3.org/TR/1998/REC-html40-19980424 Editors: Dave Raggett
    < dsr@w3.org > Arnaud Le Hors, W3C Ian Jacobs, W3C Copyright ©1997-1999 W3C ® ( MIT , INRIA , Keio ),
    All Rights Reserved. W3C liability , trademark , document use and software licensing rules apply. Abstract
    This specification defines the HyperText Markup Language (HTML), the publishing language of the World
    Wide Web. This specification defines HTML 4.01, which is a subversion of HTML 4. In addition to the
    text, multimedia, and hyperlink features of the previous versions of HTML (HTML 3.2 [HTML32] and HTML
    2.0 [RFC1866] ), HTML 4 supports more multimedia options, scripting languages, style sheets, better
    printing facilities, and documents that are more accessible to users with disabilities. HTML 4 also
    takes great strides towards the internationalization of documents, with the goal of making the Web truly
    World Wide. HTML 4 is an SGML application conforming to International Standard ISO 8879 -- Standard
    Generalized Markup Language [ISO8879] . Status of this document This section describes the status of
    this document at the time of its publication. Other documents may supersede this document. The latest
    status of this document series is maintained at the W3C. This document specifies HTML 4.01, which is
    part of the HTML 4 line of specifications. The first version of HTML 4 was HTML 4.0 [HTML40] , published
    on 18 December 1997 and revised 24 April 1998. This specification is the first HTML 4.01 Recommendation.
    It includes non-editorial changes since the 24 April version of HTML 4.0 . There have been some changes
    to the DTDs, for example. This document obsoletes previous versions of HTML 4.0, although W3C will continue
    to make those specifications and their DTDs available at the W3C Web site. This document has been reviewed
    by W3C Members and other interested parties and has been endorsed by the Director as a W3C Recommendation.
    It is a stable document and may be used as reference material or cited as a normative reference from
    another document. W3C''s role in making the Recommendation is to draw attention to the specification
    and to promote its widespread deployment. This enhances the functionality and interoperability of the
    Web. W3C recommends that user agents and authors (and in particular, authoring tools) produce HTML 4.01
    documents rather than HTML 4.0 documents. W3C recommends that authors produce HTML 4 documents instead
    of HTML 3.2 documents. For reasons of backward compatibility, W3C also recommends that tools interpreting
    HTML 4 continue to support HTML 3.2 and HTML 2.0 as well. For information about the next generation
    of HTML, "The Extensible HyperText Markup Language" [XHTML] , please refer to the W3C HTML Activity
    and the list of W3C Technical Reports . This document has been produced as part of the W3C HTML Activity
    . The goals of the HTML Working Group ( Members only ) are discussed in the HTML Working Group charter
    ( Members only ) . A list of current W3C Recommendations and other technical documents can be found
    at http://www.w3.org/TR . Public discussion on HTML features takes place on www-html@w3.org ( archives
    of www-html@w3.org ). Available languages The English version of this specification is the only normative
    version. However, for translations of this document, see http://www.w3.org/MarkUp/html4-updates/translations
    . Errata The list of known errors in this specification is available at: http://www.w3.org/MarkUp/html4-updates/errata
