title: Spektakeldebat Rutte en Baudet een hit op Google
body: “Dat verbaast me niets”, reageert hoogleraar Gerrit Voerman van de Rijksuniversiteit Groningen.
  Hij doet onderzoek naar de ontwikkeling en het functioneren van het Nederlandse en Europese partijstelsel.
  “Forum voor Democratie doet het goed in de peilingen. Er is kennelijk een grote groep kiezers erg geïnteresseerd
  in hun standpunten. Ze lijken opnieuw de grootste partij te worden.” ‘Abortus’ Het één-op-ééndebat tussen
  Rutte en Baudet gisteravond in het programma Pauw zorgde voor een flinke piek in het aantal zoekopdrachten
  via Google. Hoewel bij de overige partijen vooral op Google werd gezocht naar de partij in combinatie
  met de naam van de lijsttrekker, wordt bij Forum voor Democratie vooral gezocht in combinatie met de
  woorden ‘standpunten’, ‘Twitter’, ‘nieuws’ en ‘abortus’. “Dat er naar de partij wordt gezocht kan zowel
  positief als negatief zijn. Positief omdat men geïnteresseerd is in de standpunten van de partij. Negatief
  vanwege de uitspraken van Baudet die veel rumoer veroorzaken”, zegt Voerman. “Dat er wordt gezocht op
  abortus heeft bijvoorbeeld te maken met het essay dat hij onlangs publiceerde, waarin hij - iets gechargeerd
  gezegd - stelt dat vrouwenemancipatie bijdraagt aan de teloorgang van de maatschappij.” Tactiek De strijd
  die de twee partijen voeren werkt mobiliserend, constateert de hoogleraar. “Ze hopen op die manier meer
  stemmen te krijgen”, vertelt hij. “Dat hebben we vaker gezien tijdens verkiezingen, bijvoorbeeld tussen
  Rutte en Samsom en Lubbers en Den Uyl.” Het is dus geen nieuwe tactiek, maar wel eentje die nog steeds
  lijkt te werken. Vooral in Groningen wordt er verhoudingsgewijs veel gezocht naar Forum voor Democratie.
  Opvallend, omdat de partij niet wil dat de NAM stopt met boren naar gas in het aardbevingsgebied. In
  de provincie Utrecht wordt er bijna net zoveel gezocht naar de partij van Baudet als naar GroenLinks.
