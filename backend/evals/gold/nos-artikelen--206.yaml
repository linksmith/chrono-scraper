title: "Probo Koala: de feiten"
body:
    'Op 5 juli 2006 verlaat de Probo Koala Amsterdam met tonnen giftig afval aan boord. Op 20 augustus
    ligt het afval verspreid over tien stortplaatsen in de Ivoriaanse stad Abidjan. Gevolg: tien doden,
    duizenden mensen met gezondheidsklachten, een spoeddebat, een strafrechtelijk onderzoek en een actie
    van Greenpeace. Een overzicht van het gifschandaal. 2006 20 juni Via een agent vraagt de handelsfirma
    Trafigura aan afvalverwerker Amsterdam Port Services (APS) een offerte voor de inname van zogeheten
    slops: een mengsel van water, gasoline en caustic soda. De slops zitten aan boord van de door Trafigura
    gehuurde Griekse tanker Probo Koala, die een tijd voor Gibraltar heeft gelegen als drijvende opslag
    voor ruwe aardolie. APS biedt aan het afvalwater voor 12.000 euro te verwerken. 2 juli Om circa 12.45
    uur meert de Proba Koala aan bij boei 4 in de Afrikahaven. ''s Avonds rond 19.20 uur komt een APS-lichter
    langszij en worden de slangen aangekoppeld. Ongeveer 200 ton wordt overgepompt. Om 21.50 uur wordt het
    pompen gestaakt, mede vanwege de enorme stankoverlast, en worden de slangen afgekoppeld. 3 juli In de
    loop van de dag wordt vastgesteld dat de slops van de Probo Koala vele malen vuiler (10 keer vuiler
    zegt Trafigura, 250 keer vuiler zegt APS) zijn dan de maximale waarde voor scheepsafval. Ook is er sprake
    van een enorme stankoverlast. APS mag en kan het niet verwerken en informeert bij andere bedrijven of
    zij het wel kunnen. ATM in Moerdijk wil de klus doen, maar daar zou het 500.000 euro voor de hele lading
    kosten, in plaats van de 12.000 euro in de offerte van APS. Trafigura vindt dat te duur en wil het afval
    terugnemen. 4 juli Er ontstaat een patstelling. De Milieudienst wil het terugpompen van het afval in
    de Probo Koala verbieden. Amsterdam Port Services is bang dat de Probo Koala zonder het afval vertrekt
    en dat APS met de kosten van de verwerking blijft zitten. Daarom laat het beslag leggen op het schip.
    Uiteindelijk krijgt de Probo Koala toestemming de slops weer aan boord te nemen en te vertrekken. 5
    juli Even na 2.00 uur ''s nachts komt een APS-lichter langszij, een uur later worden de slangen aangekoppeld.
    ''s Ochtends worden de slops teruggepompt in het schip. ''s Middags vertrekt de Probo Koala naar Paldiski
    in Estland. 9 juli Aankomst in Paldiski. Op verzoek van de KLPD is via de Scheepvaartinspectie aan Estland
    gevraagd het schip te controleren. Volgens de Scheepvaartinspectie is door de Esten een Port State Control
    uitgevoerd, waarbij gekeken is naar de staat van het schip en de veiligheid aan boord. Er worden geen
    bijzonderheden geconstateerd. In Estland wordt gasolie geladen voor Nigeria. 12 juli Het Ivoriaanse
    bedrijfje Compagnie Tommy zou vanaf deze dag over een vergunning beschikken om scheepsafval in ontvangst
    te nemen. 13 juli De Probo Koala vertrekt uit Estland. 21 juli Trafigura wordt gebeld door de Nederlandse
    waterpolitie. Die wil weten wat de bestemming was van de Probo Koala en wat er precies aan boord was.
    Begin augustus De Proba Koala komt aan in Lagos, Nigeria. De gasolie wordt daar gelost. 19 augustus
    De Probo Koala komt aan in Abidjan, Ivoorkust. Het ship lost de olierestanten (gasolie en natronloog)
    bij Compagnie Tommy. De autoriteiten en het ontvangende bedrijf zijn uitvoerig op de hoogte gebracht
    van het feit dat de slops een zeer hoge COD-waarde hebben. Uit documenten blijkt dat de ''verwerking''
    door Compagnie Tommy zo''n 1500 tot 1800 dollar heeft gekost. 20 augustus ''s Nachts tussen 22.00 uur
    en de volgende ochtend wordt de lading op zeker 10 dicht bij elkaar liggende stortplaatsen in Abidjan
    gedumpt. Omwonenden worden ziek van de ''misselijkmakende dampen''. Ze krijgen inwendige klachten, ademhalingsmoelijkheden,
    neusbloedingen, hoofdpijn en moeten overgeven. 22 augustus De Probo Koala vertrekt uit Ivoorkust en
    gaat weer richting Europa. 7 september De regering van Ivoorkust is gevallen na protesten tegen de dumping
    van afval van de Probo Koala. Als gevolg van het gif zijn er dan 1700 mensen ziek geworden en drie mensen
    overleden. Volgens de WHO zit er xyleen, benzeen en zwavelwaterstof in de dampen. Ook wordt gesproken
    over het zeer giftige waterstofsulfide. In Ivoorkust worden drie mensen gearresteerd in verband met
    de affaire. Het zou gaan om een scheepsagent, iemand van de lokale Trafigura-dochter Puma Energy en
    iemand van Compagnie Tommy. Frankrijk stuurt gifspecialisten om het afval te onderzoeken. 8 september
    Het Openbaar Ministerie in Nederland stelt een onderzoek in naar de gebeurtenissen rond de Probo Koala
    in Amsterdam. Trafigura woordvoerder J. Maat zegt in dagblad Trouw dat het zich aan alle regels heeft
    gehouden en dat het ontvangende bedrijf een erkend bedrijf is. 11 september Het aantal doden in Ivoorkust
    is opgelopen tot 5, en 6000 mensen hebben gezondheidsklachten. In totaal blijkt er 400 ton vloeibaar
    afval te zijn gestort. 12 september De Verenigde Naties gaan onderzoeken of er personen of instellingen
    aansprakelijk gesteld kunnen worden voor het gifschandaal. 13 september Op Kamervragen antwoordt staatssecretaris
    Van Geel dat VROM is verteld dat het om scheepsafval ging. Hij zegt dat Nederland twee experts naar
    Ivoorkust stuurt om te helpen bij het vaststellen van de precieze samenstelling en het opruimen. Zij
    maken deel uit van het VN-team. 15 september Trouw schrijft dat VN-onderzoekers hebben vastgesteld dat
    het gif in Abidjan van dezelfde samenstelling is als in Amsterdam is aangeboden. Dat zou betekenen dat
    het niet veel later, onderweg, nog extra is vervuild. 19 september Het OM gaat er vanuit dat de slops
    van de Trafigura niet tot scheepsafval gerekend hadden mogen worden. Staatssecretaris van Geel zou de
    Kamer dus op het verkeerde been hebben gezet. En de Dienst Milieu en Bouwtoezicht Amsterdam en misschien
    ook de Amsterdam Port Authority zijn er ten onrechte vanuit gegaan dat het om scheepsafval ging. 20
    september Spoeddebat in de Tweede Kamer. Het is duidelijk dat de Kamer een onafhankelijk onderzoek wil.
    Van Geel wil dat vooralsnog niet, omdat hij het OM niet voor de voeten wil lopen. 21 september De Volkskrant
    meldt dat er nafta in benzine is omgezet op de Probo Koala voordat het schip in Amsterdam aankwam. Bij
    dat proces zou een grote hoeveelheid gif zijn geproduceerd. Trafigura ontkent dat. Volgens de firma
    is er te veel schoonmaakmiddel (caustic soda) gebruikt bij het spoelen van de olietanks. 25 september
    Greenpeace begint een blokkade-actie tegen de Probo Koala in de Estse havenstad Paldiski, waar het schip
    inmiddels weer is aangekomen. Het actieschip Action Sunrise belemmert de doorgang. 26 september Greenpeace
    doet aangifte tegen Trafigura, APS, ambtenaren van de Dienst Milieu en Bouwtoezicht. De organisatie
    hoopt hiermee te bereiken dat het schip aan de ketting wordt gelegd, zodat het niet nog eens gif kan
    verspreiden. Bovendien kan zo bewijsmateriaal aan boord van het schip veilig gesteld worden. Ivoorkust
    doet een verzoek aan Estland om het schip vast te houden. Het dodental in Ivoorkust is opgelopen naar
    tien. Vele tienduizenden Ivorianen hebben zich gemeld met gezondheidsproblemen. 27 september Estland
    laat beslag leggen op de Probo Koala nadat het OM daar een gerechtelijk onderzoek was begonnen. Volgens
    de autoriteiten vervoert het schip afval dat gelijkenis vertoont met het chemisch verontreinigde afval
    dat in Ivoorkust is gedumpt. Trafigura zegt dat het om een andere lading gaat. 10 oktober De Probo Koala
    mag Estland verlaten. Er is nog geen duidelijkheid over het onderzoek naar de lading. De Ivorianen die
    naar Estland kwamen om het schip te inspecteren hebben materiaal verzameld voor het strafrechtelijk
    onderzoek in hun land. 11 oktober Ook de inhoud van een zusterschip van de Probo Koala, de Probo Emu,
    wordt onderzocht. Spanje kijkt of het schip, dat enkele dagen eerder uit dat land vertrok, een illegale
    lading giftig afval aan boord had, die vergelijkbaar is met die op de Probo Koala. De Probo Emu zet
    koers richting het noorden. 26 oktober Vanuit Ivoorkust is een vrachtschip vertrokken naar Frankrijk,
    met aan boord 3000 ton giftig afval dat in augustus in de havenstad Abidjan werd gedumpt. Het gif zal
    in Frankrijk verder verwerkt worden. 11 november Opnieuw is een schip vertrokken naar Frankrijk met
    3000 ton giftig afval. 6 december De commissie-Hulshof oordeelt dat milieuambtenaren in de Amsterdamse
    haven fouten hebben gemaakt bij de afhandeling van de giftige lading van de Probo Koala. Zij hadden
    echter geen bevoegdheid om het schip tegen te houden toen het afvoer naar Ivoorkust. 2007 14 februari
    Trafigura, de eigenaar van de Probo Koala, heeft een schikking getroffen met de regering van Ivoorkust.
    Het bedrijf betaalt 152 miljoen euro als vergoeding voor schoonmaakkosten. 15 februari In het gifschandaal
    rond de Probo Koala zijn twee Nederlanders gearresteerd. Het zijn de directeuren van het Amsterdamse
    verwerkingsbedrijf APS dat het chemisch afval van de Probo Koala in eerste instantie accepteerde. Justitie
    wil ook de kapitein van het schip vervolgen. Tegen hem is een arrestatiebevel uitgevaardigd. 22 juni
    De Ivoriaanse president maakt bekend dat de duizenden slachtoffers die niet in het ziekenhuis zijn opgenomen
    300 euro schadevergoeding krijgen. De nabestaanden van de mensen die dioor het gif zijn gedood krijgen
    150.000 euro. Organisaties van de slachtoffers zijn kwaad over de 300 euro ("een schandelijke fooi")
    en eisen meer geld. 2008 23 oktober In Ivoorkust wordt een man veroordeeld tot 20 jaar cel voor zijn
    rol bij het gifschandaal rond de Probo Koala. Het gaat om de baas van het bedrijf dat het gif dumpte.
    Een man die had opgetreden als tussenpersoon krijgt 5 jaar cel. Zeven anderen worden vrijgesproken.
    2009 17 september Greenpeace meldt dat de directeur en medewerkers van Trafigura wisten dat de Probo
    Koala gif dumpte in Ivoorkust. Dat blijft volgens Greenpeace uit interne mails . 20 september Trafigura
    keert 33 miljoen euro uit aan Ivorianen die zeggen dat ze ziek zijn geworden. Dat komt neer op een vergoeding
    van iets meer dan duizend euro per persoon. 2010 1 juni In Amsterdam begint de strafzaak tegen Trafigura,
    de kapitein van de Probo Koala, de gemeente Amsterdam en afvalbedrijf Amsterdam Port Services (APS)
    en de oud-directeur daarvan. De rechtbank moet duidelijk krijgen of Trafigura en de kapitein wisten
    dat het afval levensgevaarlijk was. En of APS en de gemeente (eigenaar van APS) het afval wel in het
    schip hadden mogen terugpompen, en de Probo Koala toestemming hadden mogen geven om te vertrekken. 21
    juni Het Openbaar Ministerie maakt de eisen in de strafzaak bekend. Het wil dat Trafigura een boete
    krijgt van 2 miljoen euro en dat een werknemer van het bedrijf een jaar de cel in gaat. Tegen de gemeente
    Amsterdam wordt een geldboete van 150.000 euro geëist. APS moet als het aan justitie ligt een boete
    van 250.000 euro betalen. De directeur van APS hoort zes maanden cel, waarvan drie maanden voorwaardelijk,
    tegen zich eisen; de kapitein van de Probo Koala vier maanden cel.'
