# Eval corpus: ~50 sites spanning 1994-2026, all page types and web eras.
#
# CONVENTIONS
# * expected_page_type is the ground-truth label for every snapshot the entry
#   collects. 'mixed' = deliberately spans types; those snapshots need a human
#   `runner label` before they count toward filter scoring.
# * urls: explicit permalinks (deterministic, no giant CDX scan) — used for
#   90s classics, dedup seed groups, and social permalinks.
# * prefix + url_include: discovery finds real detail pages under a NARROW
#   prefix; url_include (regex on the CDX 'original' URL) keeps only detail
#   pages. Broad prefixes (e.g. /wiki/) are avoided — they time out the CDX
#   server's collapse scan. Deep modern prefixes use Common Crawl (fast index).
# * dedup_group: snapshots in one group are expected near-duplicates (same
#   body, changing chrome) — ground truth for the dedup eval.
# * source: pre-2013 must be wayback (Common Crawl starts 2013). 'both' where
#   cross-source fidelity comparison is interesting.
# * Availability is validated by `runner collect`; zero-row entries are logged,
#   not fatal — tune and re-run per-site with `collect --site KEY`.

sites:
  # =================================================================
  # ERA 1 - early static web (1994-2001): no CSS, <font>/tables/frames
  # =================================================================
  - key: cern-first-website
    category: reference
    source: wayback
    expected_page_type: article
    urls:
      - http://info.cern.ch/hypertext/WWW/TheProject.html
    from_year: 2013
    to_year: 2024
    snapshots_per_url: 5
    era_hint: early_static
    dedup_group: cern-www
    notes: First website, CERN's 2013 restoration of authentic 1992 markup; stable body = dedup seed.

